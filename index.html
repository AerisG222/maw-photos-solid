<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>MaW Photos</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1b22" />

        <script>
            /*
               The app applies `data-theme` to a wrapper inside #root, so nothing
               themes the page until Solid mounts - which shows as a flash of white
               on load for dark-theme users. Pin the persisted theme onto <html>
               up front so the very first paint is already correct. ThemeWrapper
               keeps this in sync afterwards.
            */
            (() => {
                let theme = "dark";

                try {
                    const saved = JSON.parse(localStorage.getItem("maw-photos|app") || "{}");

                    // anything else (including the legacy "dusk") falls back to dark
                    if (saved.theme === "light") {
                        theme = "light";
                    }
                } catch {
                    // swallow - the default already covers us
                }

                document.documentElement.setAttribute("data-theme", theme);
                document.documentElement.style.colorScheme = theme;
            })();
        </script>

        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Nunito+Sans&family=Tangerine&display=swap"
        />
    </head>
    <body class="h-dvh w-full overflow-hidden font-sans">
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script src="/install-service-worker.js"></script>
        <script src="/src/index.tsx" type="module"></script>
    </body>

                l = "importLibrary",
                q = "__ib__",
                m = document,
                b = window;
            b = b[c] || (b[c] = {});
            var d = b.maps || (b.maps = {}),
                r = new Set(),
                e = new URLSearchParams(),
                u = () =>
                    h ||
                    (h = new Promise(async (f, n) => {
                        await (a = m.createElement("script"));
                        e.set("libraries", [...r] + "");
                        for (k in g)
                            e.set(
                                k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()),
                                g[k]
                            );
                        e.set("callback", c + ".maps." + q);
                        a.src = `https://maps.${c}apis.com/maps/api/js?` + e;
                        d[q] = f;
                        a.onerror = () => (h = n(Error(p + " could not load.")));
                        a.nonce = m.querySelector("script[nonce]")?.nonce || "";
                        m.head.append(a);
                    }));
            d[l]
                ? console.warn(p + " only loads once. Ignoring:", g)
                : (d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n)));
        })({
            key: "AIzaSyA50h7G5fm_83lh460EnOdabUC9zU8XF7A",
            v: "weekly"
        });
    </script>
</html>
