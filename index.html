<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>MaW Photos</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1b22" />

        <script>
            /*
               The app applies `data-theme` to a wrapper inside #root, so nothing
               themes the page until Solid mounts - which shows as a flash of the
               wrong colour on load. Pin the resolved theme onto <html> up front so
               the very first paint is already correct. ThemeWrapper keeps this in
               sync afterwards.

               This has to stay inline and synchronous: it is the no-flash path.
            */
            (() => {
                const read = key => {
                    try {
                        return JSON.parse(localStorage.getItem(key) || "{}");
                    } catch {
                        return {};
                    }
                };

                // the legacy key is still read so a reader who has not yet been
                // migrated by the app does not get a flash of the wrong theme
                const saved = read("maw-photos|v2|app").theme ?? read("maw-photos|app").theme;

                let theme;

                if (saved === "light" || saved === "dark") {
                    theme = saved;
                } else {
                    /*
                       Anything else - never chosen, "system", or the legacy
                       "dusk" - follows the operating system, which is what the
                       theme-color meta tags above already do.
                    */
                    theme = window.matchMedia("(prefers-color-scheme: dark)").matches
                        ? "dark"
                        : "light";
                }

                document.documentElement.setAttribute("data-theme", theme);
                document.documentElement.style.colorScheme = theme;
            })();
        </script>

        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
    </head>
    <body class="h-dvh w-full overflow-hidden font-sans">
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script src="/install-service-worker.js"></script>
        <script src="/src/index.tsx" type="module"></script>
    </body>

    <script>

                a,

                b = window;
            b = b[c] || (b[c] = {});
            var d = b.maps || (b.maps = {}),
                r = new Set(),
                e = new URLSearchParams(),
                u = () =>
                    h ||
                    (h = new Promise(async (f, n) => {
                        await (a = m.createElement("script"));
                        e.set("libraries", [...r] + "");
                        for (k in g)
                            e.set(
                                k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()),
                                g[k]
                            );
                        e.set("callback", c + ".maps." + q);
                        a.src = `https://maps.${c}apis.com/maps/api/js?` + e;
                        d[q] = f;
                        a.onerror = () => (h = n(Error(p + " could not load.")));
                        a.nonce = m.querySelector("script[nonce]")?.nonce || "";
                        m.head.append(a);
                    }));
            d[l]
                ? console.warn(p + " only loads once. Ignoring:", g)
                : (d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n)));
        })({
            key: "AIzaSyA50h7G5fm_83lh460EnOdabUC9zU8XF7A",
            v: "weekly"
        });
    </script>
</html>
