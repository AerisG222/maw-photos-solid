# narrowly focused ansible deployment playbook for www.mikeandwan.us
---
- name: Configure Service Account
  hosts: webservers
  become: true

  tasks:
    - name: Add Service Account
      ansible.builtin.user:
        name: "{{ svcacct_name }}"
        password: "{{ svcacct_pwd | password_hash('sha512') }}"
        update_password: always
        state: present

    # fedora creates a unique subuid range automatically, so need to do this via usermod here

    - name: Enable Linger for Service Account
      ansible.builtin.command:
        cmd: loginctl enable-linger "{{ svcacct_name | quote }}"

    - name: Add SSH key to authorized_keys
      ansible.posix.authorized_key:
        user: "{{ svcacct_name }}"
        key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_rsa.pub') }}"
        state: present

- name: Configure Application
  hosts: webservers
  become: true
  become_user: "{{ svcacct_name }}"
  vars:
    pod: pod-maw-photos
    img_maw_photos: "docker.io/aerisg222/maw-photos:latest"
    container_photos: maw-photos
    dir_localroot: "{{ lookup('env', 'HOME') }}/maw-photos/{{ mawenv }}"
    dir_root: "/home/{{ svcacct_name }}"
    dir_approot: "{{ dir_root }}/maw-photos"
    dir_photosecrets: "{{ dir_approot }}/photos-secrets"
    dir_varcache: "{{ dir_approot }}/varcache"
    dir_varrun: "{{ dir_approot }}/varrun"
    dir_scripts: "{{ dir_approot }}/scripts"
    dir_podman_secrets: "{{ dir_approot }}/podman-secrets"
    dir_kube: "{{ dir_approot }}/kube"
    file_kube: "{{ dir_approot }}/kube/kube.yml"

  tasks:
    - name: Create Directories
      ansible.builtin.file:
        path: "{{ item }}"
        recurse: true
        state: directory
      loop:
        - "{{ dir_photosecrets }}"
        - "{{ dir_scripts }}"
        - "{{ dir_podman_secrets }}"
        - "{{ dir_kube }}"
        - "{{ dir_varcache }}"
        - "{{ dir_varrun }}"

    - name: Copy Files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: u+rw
      loop:
        - src: "{{ dir_localroot }}/photos-secrets/dh2048.pem"
          dest: "{{ dir_photosecrets }}"
        - src: "{{ dir_localroot }}/photos-secrets/maw-ca.crt"
          dest: "{{ dir_photosecrets }}"
        - src: "{{ dir_localroot }}/photos-secrets/maw-photos.crt"
          dest: "{{ dir_photosecrets }}"
        - src: "{{ dir_localroot }}/photos-secrets/maw-photos.key"
          dest: "{{ dir_photosecrets }}"

    - name: Process Templates
      ansible.builtin.template:
        dest: "{{ item.dest }}"
        src: "{{ item.src }}"
        mode: u+rw
      loop:
        - { "src": "kube.yml.j2", "dest": "{{ file_kube }}" }

    - name: Create maw-photos Quadlet
      containers.podman.podman_play:
        kube_file: "{{ file_kube }}"
        state: quadlet
        recreate: true
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
        quadlet_filename: "{{ pod }}"
        quadlet_file_mode: '0640'
        quadlet_options:
          - "AutoUpdate=registry"
          - |

            [Unit]
            Description=Container for photos.mikeandwan.us webserver

            [Install]
            WantedBy=multi-user.target default.target

            [Service]
            Restart=on-failure

    - name: Start and Enable Pod / Containers
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: "{{ pod }}"
        scope: user
        enabled: true
        state: restarted

    - name: Create admin scripts
      ansible.builtin.template:
        dest: "{{ dir_scripts }}/{{ item.dest }}"
        src: "{{ item.src }}"
        mode: u+rwx
      loop:
        - { "src": "logs.sh.j2", "dest": "logs.sh" }
